(function(){

function home(){return `<div class="pagehead"><h1>Your assessment at a glance</h1><p class="muted">Health, priority risks, and what needs review next.</p></div><div class="grid"><section class="panel"><div class="row between"><h2>Overall health</h2><span class="pill">Provisional</span></div><div class="gauge-row"><div class="gauge" role="img" aria-label="Illustrative provisional health score 72 out of 100"><div class="gaugeinner"><span class="number">72</span><span class="small muted">out of 100</span></div></div><div><p style="color:var(--iga-green)">↑ 3 points</p><p class="small muted">since prior assessment</p><div class="row" style="margin-top:12px"><span class="pill critical">2 Critical</span><span class="pill high">7 High</span></div></div></div><div class="caption">Draft assessment · human review remains open</div></section><section class="panel"><h2>Health by category</h2>${radar}</section><section class="panel"><div class="row between"><h2>Health over time</h2><span class="small muted">0–100 scale</span></div>${trend}<div class="caption">Comparable sample assessments · same profile</div></section><section class="panel"><div class="row between"><h2>Priority hotspots</h2><span class="pill">9 to inspect</span></div><button class="hotspot cursor-interaction" data-go="evidence"><span><b>Roles & access</b><br><span class="small muted">Privilege and inheritance</span></span><span class="pill critical">4 risks →</span></button><button class="hotspot cursor-interaction" data-go="risk"><span><b>Automation</b><br><span class="small muted">Conflicting workflows</span></span><span class="pill high">3 risks →</span></button><button class="hotspot cursor-interaction" data-go="risk"><span><b>Operations</b><br><span class="small muted">Repeated processing failures</span></span><span class="pill high">2 risks →</span></button></section><section class="panel span2"><div class="row between"><div><h2 style="margin-bottom:4px">Review focus</h2><p class="muted small">6 proposed findings await review · 2 are Critical or High.</p></div><button class="action cursor-interaction" data-go="risk">Explore priority risks ${icon('arrow-right')}</button></div><div class="caption" style="margin-top:15px">Assessment quality: 89% coverage · limitations tracked separately from health.</div></section></div>`;}
function risk(){let critical=state.severity==='Critical';return `<div class="pagehead"><h1>Risk analysis</h1><p class="muted">See concentrations, then inspect the finding behind each signal.</p></div><div class="filters" aria-label="Severity filters">${['All','Critical','High','Medium'].map(v=>`<button class="cursor-interaction" data-filter="${v}" aria-pressed="${state.severity===v}">${v==='All'?'All findings':v}</button>`).join('')}</div><div class="risk-layout"><div class="grid"><section class="panel"><div class="row between"><h2>Severity distribution</h2><span class="small muted">${state.severity==='All'?'33':critical?'2':state.severity==='High'?'7':'24'} findings in view</span></div>${[['Critical',2,'var(--iga-red)'],['High',7,'var(--iga-orange)'],['Medium',24,'var(--iga-blue)']].filter(([label])=>state.severity==='All'||state.severity===label).map(([label,n,color])=>`<div class="barrow"><span>${label}</span><div class="track"><span style="width:${n/24*100}%;background:${color}"></span></div><b>${n}</b></div>`).join('')}<div class="caption">Finding count · bar scale 0–24 · severity remains separate from confidence.</div></section><section class="panel"><h2>Category hotspots</h2><div class="heat" aria-label="Illustrative finding counts by category and severity"><span></span><span style="text-align:center">Critical</span><span style="text-align:center">High</span><span style="text-align:center">Medium</span>${[['Security',2,3,8],['Correctness',0,2,6],['Performance',0,1,5],['Maintainability',0,0,3],['Operations',0,1,2]].map(([name,c,h,m])=>`<span>${name}</span>${[[c,'Critical'],[h,'High'],[m,'Medium']].map(([n,s])=>`<button class="cell ${s.toLowerCase()} cursor-interaction" data-heat="${s}" aria-label="${name}, ${s}, ${n} illustrative findings" ${state.severity!=='All'&&state.severity!==s?'style="opacity:.4"':''}>${n}</button>`).join('')}`).join('')}</div><div class="legend"><span>Cell values = finding count</span><span>Click a severity to focus the view</span></div></section><section class="panel"><div class="row between"><h2>Priority findings</h2><span class="small muted">Sample snapshot</span></div>${state.severity==='All'||critical?`<button class="hotspot cursor-interaction" data-go="evidence"><span><span class="pill critical">Critical</span><h3 style="margin-top:6px">Conflicting role inheritance</h3><span class="small muted">Confirmed · Security · Deterministic</span></span><span>→</span></button>`:''}${state.severity==='Medium'?'<p class="muted small">24 Medium findings in the sample snapshot.</p>':critical?'':`<button class="hotspot cursor-interaction" data-go="evidence"><span><span class="pill high">High</span><h3 style="margin-top:6px">Repeated automation failures</h3><span class="small muted">Proposed · Operations · AI-assisted</span></span><span>→</span></button>`}</section></div><aside class="panel"><h2>Assessment context</h2><div class="signal"><b>Privilege is the main hotspot</b><p>2 Critical and 3 High findings are in Security.</p></div><dl><dt>Proposed findings</dt><dd>6 · excluded from finalized score until review</dd><dt>Confirmed findings</dt><dd>25</dd><dt>Accepted risk</dt><dd>2 · shown explicitly</dd><dt>Quality</dt><dd>89% evidence coverage</dd></dl><div class="caption">Risk, review state, confidence, and coverage stay distinct.</div><button class="action quiet cursor-interaction" data-go="evidence" style="margin-top:18px;width:100%">Inspect role relationship ${icon('arrow-right')}</button></aside></div>`;}

</b>Deterministic rule</div><div class="step"><b>Original state</b>Proposed</div><div class="step"><b>Current state</b>Confirmed</div></div><details><summary>Review-only recommendation</summary><p class="muted">Review the conflicting inheritance and supported access design with the authorized owner. Validate in a separate test environment. Guidance is unverified; no change is executed.</p></details></section></div><aside class="panel"><div class="row between"><h2>Evidence panel</h2><span class="pill">Reference only</span></div><h3>${d[0]}</h3><dl><dt>Object reference</dt><dd>${d[1]}</dd><dt>Observed sample fact</dt><dd>${d[2]}</dd><dt>Provenance</dt><dd>Captured assessment → roles → inheritance</dd><dt>Rule reference</dt><dd>Role conflict · sample v1</dd><dt>Evidence access</dt><dd>Protected raw evidence unavailable in this mockup.</dd></dl><h2 style="margin-top:22px">Review history</h2><div class="timeline"><div class="timelinedots"><span></span><i></i><span></span></div><div><p><b>Generated</b><br><span class="muted">02 Oct · Proposed</span></p><p><b>Consultant reviewed</b><br><span class="muted">02 Oct · Confirmed</span></p></div></div><details><summary>Immutable original and limitations</summary><p class="muted">Illustrative topology, references, rule and review history. No customer data or raw evidence is included. Confirmation is a finding disposition, not a verified remediation.</p></details></aside></div>`;}
function render(){page.innerHTML=state.page==='home'?home():state.page==='risk'?risk():evidence();root.querySelectorAll('[data-page]').forEach(b=>{if(b.dataset.page===state.page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});root.querySelector('#iga-page-status').textContent=names[state.page];root.querySelectorAll('.panel').forEach(e=>e.style.borderRadius=state.radius+'px');if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});}
function apply(saved){let s=saved?.modelContent;if(s&&names[s.area])state.page=s.area;if(s&&['All','Critical','High','Medium'].includes(s.severity))state.severity=s.severity;if(s&&nodes[s.selectedObject])state.node=s.selectedObject;render();}
function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{area:state.page,severity:state.severity,selectedObject:state.node},privateContent:{radius:state.radius}}).catch(()=>{});}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page||b.dataset.go){state.page=b.dataset.page||b.dataset.go;render();save();}else if(b.dataset.filter||b.dataset.heat){const v=b.dataset.filter||b.dataset.heat;state.severity=['Critical','High','Medium'].includes(v)?v:'All';render();save();}else if(b.dataset.node){state.node=b.dataset.node;render();save();}else if(b.id==='iga-settings-toggle'){const settings=root.querySelector('#iga-mock-settings');settings.hidden=!settings.hidden;b.setAttribute('aria-expanded',String(!settings.hidden));}});
apply(window.openai?.widgetState);
