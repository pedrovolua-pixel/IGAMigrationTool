y.toLowerCase()}</dd></div></dl><p class="notice">Protected raw evidence is unavailable in this mockup.</p></section><div class="workspace-action"><button type="button" class="action quiet cursor-interaction" data-workspace="true">Expand workspace ${icon('maximize-2')}</button></div></section>`;}

function drawer(){const f=selected();const outside=!matching().some(x=>x.id===f.id);return `<aside class="panel risk-drawer ${state.tab==='Relationships'?'relationship-wide':''}" id="iga-risk-detail" role="dialog" aria-modal="true" aria-label="Risk details"><div class="drawer-head"><h2>Risk details</h2><button type="button" class="action quiet drawer-close-desktop cursor-interaction" data-close="true">Close</button><button type="button" class="action quiet drawer-mobile-back cursor-interaction" data-close="true">← Back to risks</button></div><div class="row">${badge(f)}<span class="pill">${f.status}</span></div><h3>${f.title}</h3>${outside?'<div class="caption">Selected finding is outside the current filters.</div>':''}<div class="summaryfacts"><div>Category<b>${f.category}</b></div><div>Confidence<b>${f.confidence}</b></div></div><div class="details-tabs" aria-label="Risk detail sections">${['Overview','Relationships','Evidence','Review'].map(t=>`<button type="button" class="cursor-interaction" data-detail-tab="${t}" aria-pressed="${state.tab===t}">${t}</button>`).join('')}</div><div id="iga-risk-tab-content">${state.tab==='Relationships'?relationshipContent():state.tab==='Overview'?`<div class="detailblock"><h4>Why this matters</h4><p>${explanation(f)}</p></div><div class="detailblock"><h4>Potential impact</h4><p>${impact(f)}</p></div><div class="detailblock"><h4>Assessment method</h4><p class="small">${f.method} · rule v1 · illustrative evidence</p></div><div class="detailblock"><h4>Review-only guidance</h4><p class="small muted">Check the affected configuration and supported design with the authorized owner. Validate changes in a separate test environment.</p></div>`:state.tab==='Evidence'?`<div class="detailblock"><h4>Supporting reference</h4><button class="reference-button cursor-interaction" data-expand="true">${f.reference}<br><b>${topology(f)[0][0]}</b><br>Explore in this panel →</button></div><dl><dt>Provenance</dt><dd>Captured assessment → ${f.category.to function risk(){const visible=matching();const severityCounts=['Critical','High','Medium'].map(s=>findings.filter(f=>(state.category==='All'||f.category===state.category)&&f.severity===s).length);return `<div class="pagehead"><h1>Risk analysis</h1><p class="muted">Select a hotspot, then open a finding over the page.</p></div><div class="filters" aria-label="Severity filters">${['All','Critical','High','Medium'].map(v=>`<button type="button" class="cursor-interaction" data-filter="${v}" aria-pressed="${state.severity===v}">${v==='All'?'All findings':v}</button>`).join('')}</div><div class="category-select"><label for="iga-category">Category</label><select id="iga-category">${['All',...categoryNames].map(c=>`<option${state.category===c?' selected':''}>${c}</option>`).join('')}</select>${state.category!=='All'||state.severity!=='All'?'<button type="button" class="clearfilter cursor-interaction" data-clear="true">Clear filters</button>':''}<span class="small muted">${visible.length} of 33 findings</span></div><div class="risk-shell"><div class="risk-main"><div class="grid"><section class="panel"><h2>Severity distribution</h2>${['Critical','High','Medium'].map((s,i)=>`<button type="button" class="sevbutton cursor-interaction" data-filter="${s}" aria-label="${s} findings, ${severityCounts[i]}" aria-pressed="${state.severity===s}"><span>${s}</span><div class="track"><span style="width:${severityCounts[i]/24*100}%;background:${['var(--iga-red)','var(--iga-orange)','var(--iga-blue)'][i]}"></span></div><b>${severityCounts[i]}</b></button>`).join('')}<div class="caption">Count by selected category · scale 0–24</div></section><section class="panel"><h2>Category hotspots</h2><div class="heat" aria-label="Finding counts by category and severity"><span></span><span style="text-align:center">Critical</span><span style="text-align:center">High</span><span style="text-align:center">Medium</span>${categoryNames.map((c,ci)=>`<span>${c}</span>${categoryCounts[ci].map((n,si)=>`<button type="button" class="cell ${['critical','high','medium'][si]} cursor-interaction" data-heat="${['Critical','High','Medium'][si]}" data-category="${c}" aria-pressed="${state.category===c&&state.severity===['Critical','High','Medium'][si]}" aria-label="${c}, ${['Critical','High','Medium'][si]}, ${n} findings" ${n===0?'disabled':''}>${n}</button>`).join('')}`).join('')}</div><div class="legend">Select a cell to filter category + severity</div></section></div><section class="panel" id="iga-findings-list" aria-label="Filtered findings"><div class="row between"><h2>Findings</h2><span class="small muted">${visible.length} matching</span></div>${visible.length?visible.slice(0,state.limit).map(listRow).join(''):'<p class="empty">No findings match. Clear filters to show all findings.</p>'}${visible.length>state.limit?'<button type="button" class="action quiet cursor-interaction" data-more="true" style="margin-top:14px">Show more findings</button>':''}</section></div></div>`;}
function evidence(){const f=selected(),t=topology(f);const index=['role','inherited','permission'].indexOf(state.node);const d=t[index<0?0:index];return `<div class="pagehead"><div class="row"><button type="button" class="textbutton cursor-interaction" data-return="true">← Back to risk details</button>${badge(f)}<span class="pill">${f.status}</span></div><h1>${f.title}</h1><p class="muted">Explore the relationship, then select an object for its evidence.</p></div><div class="evidence-layout"><div class="grid"><section class="panel"><div class="row between"><h2>${f.category==='Security'?'Access relationship':'Finding relationship'}</h2><span class="small muted">3 sample objects</span></div><div class="mapping"><button type="button" class="node cursor-interaction" data-node="role" aria-pressed="${state.node==='role'}"><span class="small muted">Source object</span><br><b>${t[0][0].split(' · ')[1]}</b></button><span class="connector" aria-label="linked to">→</span><button type="button" class="node cursor-interaction" data-node="inherited" aria-pressed="${state.node==='inherited'}"><span class="small muted">Related object</span><br><b>${t[1][0].split(' · ')[1]}</b></button><span class="mapdown" aria-label="linked to">↓ ${f.category==='Security'?'grants':'affects'}</span><button type="button" class="node cursor-interaction" data-node="permission" aria-pressed="${state.node==='permission'}" style="grid-column:3"><span class="small muted">Affected object</span><br><b>${t[2][0].split(' · ')[1]}</b></button><div class="node mapwide"><span class="small">Affected outcome</span><br><b>${f.category==='Security'?'Separation of responsibilities':f.category==='Performance'?'Timely provisioning':'Reliable identity operations'}</b></div></div><div class="caption">Select any object to inspect its sample evidence.</div></section><section class="panel"><h2>Finding explanation</h2><div class="signal"><b>${explanation(f)}</b><p>${impact(f)}</p></div><div class="row between"><span class="small muted">Confidence · ${f.method}</span><b>${f.confidence}</b></div><div class="track" style="margin-top:9px"><span style="width:${f.confidence}"></span></div><div class="steps"><div class="step"><b>Method</b>${f.method}</div><div class="step"><b>Original state</b>Proposed</div><div class="step"><b>Current state</b>${f.status}</div></div><details><summary>Review-only recommendation</summary><p class="muted">Review with the authorized owner and validate in a test environment. This guidance is unverified; no change is executed.</p></details></section></div><aside class="panel" aria-label="Object evidence"><div class="row between"><h2>Evidence panel</h2><span class="pill">Reference only</span></div><h3>${d[0]}</h3><dl><dt>Object reference</dt><dd>${d[1]}</dd><dt>Observed sample fact</dt><dd>${d[2]}</dd><dt>Evidence reference</dt><dd>${f.reference}</dd><dt>Provenance</dt><dd>Captured assessment → ${f.category.toLowerCase()} → relationship</dd><dt>Access</dt><dd>Protected raw evidence unavailable in this mockup.</dd></dl><h2 style="margin-top:22px">Review history</h2><div class="timeline"><div class="timelinedots"><span></span><i></i><span></span></div><div><p><b>Generated</b><br><span class="muted">02 Oct · Proposed</span></p><p><b>${f.status==='Proposed'?'Review pending':'Reviewed'}</b><br><span class="muted">02 Oct · ${f.status}</span></p></div></div><details><summary>Original and limitations</summary><p class="muted">Illustrative references, topology and review history. A finding disposition does not represent verified remediation.</p></details></aside></div>`;}
function render(){const previousScroll=window.scrollY;page.innerHTML=state.page==='home'?home():state.page==='risk'?risk():evidence();let layer=root.querySelector('.drawer-layer');if(layer)layer.remove();const opened=state.page==='risk'&&Boolean(state.selected);root.classList.toggle('is-overlay',opened);root.querySelector('.shell').inert=opened;if(opened){layer=document.createElement('div');layer.className='drawer-layer';layer.innerHTML='<div class="drawer-scrim" data-dismiss="true" aria-hidden="true"></div>'+drawer();root.appendChild(layer);}root.querySelectorAll('[data-page]').forEach(b=>{if(b.dataset.page===state.page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});root.querySelector('#iga-page-status').textContent=names[state.page]+(state.selected?' · '+selected().title:'');root.querySelectorAll('.panel').forEach(e=>e.style.borderRadius=state.radius+'px');const note=root.querySelector('#iga-review-note');if(note)note.value=state.notes[state.selected]||'';window.scrollTo(0,previousScroll);if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});}

function close(){state.selected=null;state.tab='Overview';render();if(state.returnId)focus('#'+state.returnId);window.scrollTo(0,state.originScroll);save();}
function snapshot(){return JSON.stringify([state.page,state.severity,state.category,state.node,state.selected,state.tab,state.notes]);}
function apply(saved){const before=snapshot();let s=saved?.modelContent,p=saved?.privateContent;if(p?.clientId===clientId&&p.revision<=state.revision)return;if(s&&names[s.area])state.page=s.area;if(s&&['All','Critical','High','Medium'].includes(s.severity))state.severity=s.severity;if(s&&['All',...categoryNames].includes(s.category))state.category=s.category;if(s&&['role','inherited','permission'].includes(s.selectedObject))state.node=s.selectedObject;if(s&&Object.hasOwn(s,'selectedFinding'))state.selected=findings.some(f=>f.id===s.selectedFinding)?s.selectedFinding:null;if(s&&['Overview','Relationships','Evidence','Review'].includes(s.detailSection))state.tab=s.detailSection;if(p?.notes&&typeof p.notes==='object')state.notes=p.notes;if(state.page==='evidence'&&state.selected&&!p?.explicitWorkspace){state.page='risk';state.tab='Relationships';}if(!page.childElementCount||before!==snapshot())render();}
function save(){state.revision++;if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{area:state.page,severity:state.severity,category:state.category,selectedObject:state.node,selectedFinding:state.selected,detailSection:state.tab},privateContent:{radius:state.radius,notes:state.notes,clientId,revision:state.revision,explicitWorkspace:state.page==='evidence'}}).catch(()=>{});}

root.addEventListener('keydown',e=>{if(state.page!=='risk'||!state.selected)return;if(e.key==='Escape'){e.preventDefault();close();return;}if(e.key==='Tab'){const dialog=root.querySelector('[role="dialog"]');const controls=[...dialog.querySelectorAll('button,textarea,select,input,a[href]')].filter(x=>!x.disabled&&x.getClientRects().length);const first=controls[0],last=controls[controls.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});

else if(b.dataset.workspace){state.riskScroll=window.scrollY;state.page='evidence';state.evidenceReturn=true;render();focus('[data-return]');window.scrollTo(0,0);save();}
else if(b.dataset.return){state.page='risk';if(!state.selected)state.selected='risk-1';state.tab='Relationships';render();focus('[data-detail-tab="Relationships"]');window.scrollTo(0,state.riskScroll);save();}
else if(b.dataset.detailTab){state.tab=b.dataset.detailTab;render();focus(`[data-detail-tab="${state.tab}"]`);save();}
else if(b.dataset.clear){state.severity='All';state.category='All';render();focus('[data-filter="All"]');save();}
else if(b.dataset.filter||b.dataset.heat){state.severity=b.dataset.filter||b.dataset.heat;state.limit=8;if(b.dataset.category)state.category=b.dataset.category;render();if(b.dataset.heat)focus(`[data-category="${state.category}"][data-heat="${state.severity}"]`);else focus(`.filters [data-filter="${state.severity}"]`);save();}
else if(b.dataset.hotspot){state.page='risk';state.selected=null;state.severity='All';state.category=b.dataset.hotspot;render();save();}
else if(b.dataset.page||b.dataset.go){state.page=b.dataset.page||b.dataset.go;state.selected=null;if(state.page==='evidence'){state.selected='risk-1';state.node='role';}render();save();}
else if(b.dataset.node){state.node=b.dataset.node;render();focus(`[data-node="${state.node}"]`);save();}
else if(b.id==='iga-settings-toggle'){const settings=root.querySelector('#iga-mock-settings');settings.hidden=!settings.hidden;b.setAttribute('aria-expanded',String(!settings.hidden));}
});
apply(window.openai?.widgetState);
window.addEventListener('openai:set_globals',e=>apply(e.detail?.globals?.widgetState));
if(globalThis.Tweak){const t=new Tweak({container:root,onChange:()=>{root.querySelectorAll('.panel').forEach(e=>e.style.borderRadius=state.radius+'px');}});t.addSlider(state,'radius',{label:'Panel corners',min:4,max:20,unit:'px'});}

})();
</script>
</div>
