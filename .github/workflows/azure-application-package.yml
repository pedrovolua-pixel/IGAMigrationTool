name: Azure development package (partial checks)

on:
  pull_request:
    paths:
      - 'src/server/hosts/AzureDevelopmentBootstrap/**'
      - 'src/server/hosts/BffDevelopmentHost/**'
      - 'src/server/hosts/BffFoundation/**'
      - 'src/server/modules/IdentitySessions/**'
      - 'migrations/identity-sessions/**'
      - 'tests/integration/BffDevelopmentHost/**'
      - 'tests/infrastructure/ImageEvidence/**'
      - 'infra/containers/**'
      - 'infra/bicep/**'
      - 'tests/infrastructure/AzureApplicationPackage/**'
      - 'tests/integration/AzureDevelopmentBootstrap/**'
      - '.github/workflows/azure-application-package.yml'
      - 'global.json'
      - 'Directory.Build.props'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install approved SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Build and verify inert host
        run: |
          dotnet restore src/server/hosts/AzureDevelopmentBootstrap/AzureDevelopmentBootstrap.csproj --locked-mode
          dotnet format src/server/hosts/AzureDevelopmentBootstrap/AzureDevelopmentBootstrap.csproj --verify-no-changes --no-restore
          dotnet publish src/server/hosts/AzureDevelopmentBootstrap/AzureDevelopmentBootstrap.csproj -c Release --no-restore --no-self-contained -o "$RUNNER_TEMP/bootstrap" /p:UseAppHost=false
          python3 tests/integration/AzureDevelopmentBootstrap/verify.py --dotnet "$(command -v dotnet)" --assembly "$RUNNER_TEMP/bootstrap/AzureDevelopmentBootstrap.dll"
      - name: Build and exercise non-root container
        run: |
          python3 infra/containers/build-development-bootstrap.py
          python3 tests/integration/AzureDevelopmentBootstrap/verify.py --docker-image iga-azure-development-bootstrap:local
          docker image inspect iga-azure-development-bootstrap:local --format 'Local image config digest={{.Id}}; user={{.Config.User}}; architecture={{.Architecture}}'
      - name: Install pinned Bicep
        run: |
          curl -fsSL https://github.com/Azure/bicep/releases/download/v0.47.16/bicep-linux-x64 -o "$RUNNER_TEMP/bicep"
          echo "64c345a58e0c3e48b1bc98a4e62d6b3adb1d238281297de3400aeafb2697aa5a  $RUNNER_TEMP/bicep" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bicep"
      - name: Check private hosting template
        run: |
          "$RUNNER_TEMP/bicep" build infra/bicep/modules/pilot-development-bootstrap-apps.bicep --outfile "$RUNNER_TEMP/bootstrap-module.json"
          "$RUNNER_TEMP/bicep" lint infra/bicep/modules/pilot-development-bootstrap-apps.bicep
          "$RUNNER_TEMP/bicep" build infra/bicep/pilot-development-bootstrap-apps.bicep --outfile "$RUNNER_TEMP/bootstrap-root.json"
          "$RUNNER_TEMP/bicep" lint infra/bicep/pilot-development-bootstrap-apps.bicep
          python3 tests/infrastructure/AzureApplicationPackage/hosting-policy.py "$RUNNER_TEMP/bootstrap-root.json" "$RUNNER_TEMP/bootstrap-module.json"

  bff-disabled-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install approved SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Verify hard-disabled BFF process and package inputs
        run: |
          dotnet restore src/server/hosts/BffDevelopmentHost/BffDevelopmentHost.csproj --locked-mode
          dotnet format src/server/hosts/BffDevelopmentHost/BffDevelopmentHost.csproj --verify-no-changes --no-restore
          dotnet publish src/server/hosts/BffDevelopmentHost/BffDevelopmentHost.csproj -c Release --no-restore --no-self-contained -o "$RUNNER_TEMP/bff-disabled" /p:UseAppHost=false
          python3 tests/integration/BffDevelopmentHost/verify_inputs.py
          python3 tests/integration/BffDevelopmentHost/verify.py --dotnet "$(command -v dotnet)" --assembly "$RUNNER_TEMP/bff-disabled/BffDevelopmentHost.dll"
      - name: Build and exercise non-root read-only BFF container
        run: |
          python3 infra/containers/build-bff-development.py
          python3 tests/integration/BffDevelopmentHost/verify.py --docker-image iga-bff-development:local
      - name: Check inventory collector negative fixtures
        run: python3 -m unittest discover -s tests/infrastructure/ImageEvidence -p 'test_*.py'
      - name: Install immutable official inventory scanner
        run: |
          curl -fsSL https://github.com/aquasecurity/trivy/releases/download/v0.73.0/trivy_0.73.0_Linux-64bit.tar.gz -o "$RUNNER_TEMP/trivy.tar.gz"
          echo "2edd39da482bb4e9831962487b68f68e3928ec3137794757f54d00383d79547b  $RUNNER_TEMP/trivy.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
          echo "5b3ebab0f98d95196c85efc3a9d31a01520c96fa342e4e611f56db64c516df1d  $RUNNER_TEMP/trivy" | sha256sum -c -
      - name: Collect exact local image inventories without promotion or upload
        run: |
          python3 infra/containers/collect-image-evidence.py \
            --image "$(docker image inspect iga-bff-development:local --format '{{.Id}}')" \
            --trivy "$RUNNER_TEMP/trivy" --source-sha "$(git rev-parse HEAD)" \
            --input-lock global.json --input-lock Directory.Build.props \
            --input-lock infra/containers/azure-development-bootstrap.images.lock.json \
            --input-lock infra/containers/bff-development.images.lock.json \
            --input-lock infra/containers/image-evidence-tools.lock.json \
            --input-lock infra/containers/bff-development.Dockerfile \
            --input-lock infra/containers/bff-development.Dockerfile.dockerignore \
            --input-lock src/server/hosts/BffDevelopmentHost/packages.lock.json \
            --input-lock src/server/hosts/BffFoundation/packages.lock.json \
            --input-lock src/server/modules/IdentitySessions/packages.lock.json \
            --output "$RUNNER_TEMP/bff-image-evidence"
      - name: Remove ephemeral raw image evidence
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/bff-image-evidence" "$RUNNER_TEMP/trivy.tar.gz" "$RUNNER_TEMP/trivy"
