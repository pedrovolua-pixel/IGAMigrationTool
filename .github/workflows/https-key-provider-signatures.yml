name: HTTPS key provider signatures (artifact prerequisite only)

'on':
  pull_request:
    paths:
      - '.github/workflows/https-key-provider-signatures.yml'
      - 'tests/infrastructure/HttpsKeyProviders/resolved-37-archives.json'
      - 'tests/infrastructure/HttpsKeyProviders/verify-signatures.py'
      - 'tests/infrastructure/HttpsKeyProviders/test_verify_signatures.py'
      - 'tests/infrastructure/HttpsKeyProviders/download-archives.py'
      - 'tests/infrastructure/HttpsKeyProviders/test_download_archives.py'
      - 'docs/development/https-key-provider-ci-proof-packet.md'
  # Manual dispatch requires this workflow to exist on the default branch.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-37-signatures:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_UI_LANGUAGE: en-US
    steps:
      - name: Check out the proof source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check diagnostic safety cases without network
        run: |
          python3 tests/infrastructure/HttpsKeyProviders/test_verify_signatures.py
          python3 tests/infrastructure/HttpsKeyProviders/test_download_archives.py
      - name: Set up the exact approved SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.401'
          cache: false
      - name: Capture source, runner and normal SDK trust candidates
        env:
          PROOF_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PROOF_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PY'
          import hashlib, importlib.util, json, os, pathlib, platform, shutil, subprocess
          directory = pathlib.Path('tests/infrastructure/HttpsKeyProviders')
          spec = importlib.util.spec_from_file_location('signature_verifier', directory / 'verify-signatures.py')
          v = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(v)
          v.environment_check(os.environ)
          v.load_manifest()
          if platform.system() != 'Linux':
              raise ValueError('Expected the approved Linux target')
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'https-key-provider-proof'
          output.mkdir()
          metadata = output / 'metadata'
          metadata.mkdir()
          v.write_json(metadata / 'global.json', {'sdk': {'version': v.SDK, 'rollForward': 'disable', 'allowPrerelease': False}})
          paths = [
              '.github/workflows/https-key-provider-signatures.yml',
              'tests/infrastructure/HttpsKeyProviders/resolved-37-archives.json',
              'tests/infrastructure/HttpsKeyProviders/verify-signatures.py',
              'tests/infrastructure/HttpsKeyProviders/test_verify_signatures.py',
              'tests/infrastructure/HttpsKeyProviders/download-archives.py',
              'tests/infrastructure/HttpsKeyProviders/test_download_archives.py',
              'docs/development/https-key-provider-ci-proof-packet.md',
          ]
          public = {key: os.environ.get(key) for key in (
              'ImageOS', 'ImageVersion', 'RUNNER_OS', 'RUNNER_ARCH', 'GITHUB_RUN_ID',
              'GITHUB_RUN_ATTEMPT', 'GITHUB_SHA', 'GITHUB_EVENT_NAME',
              'PROOF_PR_HEAD_SHA', 'PROOF_PR_BASE_SHA',
          )}
          source = subprocess.run(['git', 'rev-parse', 'HEAD'], capture_output=True, check=True, timeout=30).stdout.decode().strip()
          executable = shutil.which('dotnet')
          if not executable or not pathlib.Path(executable).is_absolute():
              raise ValueError('Missing absolute native SDK executable')
          executable = str(pathlib.Path(executable).resolve())
          if pathlib.Path(executable).name != 'dotnet':
              raise ValueError('Unexpected native SDK filename')
          provenance = {
              'schemaVersion': 1, 'status': 'FAILED', 'startedAtUtc': v.utc_now(),
              'sourceSHA': source, 'publicRunnerFields': public,
              'platformRelease': platform.release(), 'architecture': platform.machine(),
              'sdkVersionRequired': v.SDK, 'dotnetExecutable': executable,
              'manifestSHA256': v.MANIFEST_SHA256,
              'sourceFilesSHA256': {path: v.digest(pathlib.Path(path)) for path in paths},
              'runnerMinimumVersionRequired': '2.327.1',
              'runnerVersionFromOptionalEnvironment': os.environ.get('RUNNER_VERSION'),
              'runnerVersionEvidenceRequired': 'Retain and independently review the actual Setup job log; optional environment is not proof.',
              'artifactRetention': {'mode': 'repository-default', 'effectiveDaysObserved': None},
              'normalTrustCandidates': [],
          }
          try:
              for key in ('ImageOS', 'ImageVersion', 'RUNNER_OS', 'RUNNER_ARCH', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_SHA', 'GITHUB_EVENT_NAME'):
                  if not public[key]:
                      raise ValueError('Required public runner metadata is missing')
              if public['RUNNER_OS'] != 'Linux' or public['GITHUB_EVENT_NAME'] not in ('pull_request', 'workflow_dispatch'):
                  raise ValueError('Unexpected runner or workflow event')
              if public['GITHUB_EVENT_NAME'] == 'pull_request' and (not public['PROOF_PR_HEAD_SHA'] or not public['PROOF_PR_BASE_SHA']):
                  raise ValueError('Missing PR source bindings')
              if source != public['GITHUB_SHA']:
                  raise ValueError('Checkout differs from the event source')
              entry, _ = v.capture([executable, '--info'], metadata, dict(os.environ), 'sdk-info', subprocess.run)
              provenance['sdkInfo'] = entry
              if entry['exitCode'] != 0:
                  raise ValueError('SDK information failed')
              sdk_root = pathlib.Path(executable).resolve().parent / 'sdk' / v.SDK / 'trustedroots'
              candidates = [sdk_root / 'codesignctl.pem', sdk_root / 'timestampctl.pem', pathlib.Path('/etc/pki/ca-trust/extracted/pem/objsign-ca-bundle.pem')]
              for path in candidates:
                  provenance['normalTrustCandidates'].append({'path': str(path), 'present': path.is_file(), 'sha256': hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else None})
              if not all(item['present'] for item in provenance['normalTrustCandidates'][:2]):
                  raise ValueError('Missing selected SDK trust bundles')
              provenance['status'] = 'RECORDED_PENDING_SETUP_JOB_REVIEW'
          except (OSError, ValueError) as error:
              provenance['failureType'] = type(error).__name__
              raise
          finally:
              provenance['finishedAtUtc'] = v.utc_now()
              v.write_json(metadata / 'provenance.json', provenance)
          PY
      - name: Acquire only the pinned official archives
        run: |
          python3 tests/infrastructure/HttpsKeyProviders/download-archives.py \
            --archives "$RUNNER_TEMP/https-key-provider-proof/acquired-archives" \
            --receipts "$RUNNER_TEMP/https-key-provider-proof/download-receipts"
      - name: Verify all 37 normal signatures with direct exit receipts
        run: |
          python3 tests/infrastructure/HttpsKeyProviders/verify-signatures.py \
            --archives "$RUNNER_TEMP/https-key-provider-proof/acquired-archives" \
            --dotnet "$(readlink -f "$(command -v dotnet)")" \
            --evidence "$RUNNER_TEMP/https-key-provider-proof/signature-receipts"
      - name: Require complete machine signature evidence
        run: |
          python3 - <<'PY'
          import hashlib, importlib.util, json, os, pathlib
          directory = pathlib.Path('tests/infrastructure/HttpsKeyProviders')
          spec = importlib.util.spec_from_file_location('signature_verifier', directory / 'verify-signatures.py')
          v = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(v)
          m = v.load_manifest()
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'https-key-provider-proof'
          def read(path):
              return json.loads(path.read_bytes(), object_pairs_hook=v.closed_pairs)
          acquisition = read(root / 'download-receipts/download-receipt.json')
          signatures = read(root / 'signature-receipts/receipt.json')
          provenance = read(root / 'metadata/provenance.json')
          if acquisition['status'] != 'PASS' or signatures['status'] != 'PASS' or provenance['status'] != 'RECORDED_PENDING_SETUP_JOB_REVIEW':
              raise ValueError('No complete successful machine evidence')
          for receipt in (acquisition, signatures, provenance):
              if receipt['manifestSHA256'] != v.MANIFEST_SHA256:
                  raise ValueError('Mismatched manifest evidence')
          expected = {(p['id'], p['version'], p['archiveSHA256']) for p in m['packages']}
          acquired = {(p['id'], p['version'], p['sha256']) for p in acquisition['packages']}
          verified = {(p['id'], p['version'], p['archiveSHA256']) for p in signatures['packages']}
          if len(acquisition['packages']) != 37 or len(signatures['packages']) != 37 or acquired != expected or verified != expected:
              raise ValueError('Incomplete or substituted package evidence')
          if not all(p['status'] == 'HASH_VERIFIED' for p in acquisition['packages']) or not all(p['status'] == 'EXITED' and p['exitCode'] == 0 for p in signatures['packages']):
              raise ValueError('Failed package acquisition or verifier execution')
          for path, digest in provenance['sourceFilesSHA256'].items():
              if v.digest(pathlib.Path(path)) != digest:
                  raise ValueError('Source changed during execution')
          for folder, entries in ((root / 'signature-receipts', [signatures['sdk'], *signatures['packages']]), (root / 'metadata', [provenance['sdkInfo']])):
              for entry in entries:
                  if entry['exitCode'] != 0:
                      raise ValueError('Failed SDK command')
                  for kind in ('stdout', 'stderr'):
                      log = entry[kind]
                      path = folder / log['fileName']
                      if path.parent != folder or v.digest(path) != log['sha256'] or path.stat().st_size != log['bytes']:
                          raise ValueError('Incomplete or altered raw command logs')
          for filename, field in (('global.json', 'sdkPinSHA256'), ('nuget-verification.config', 'configSHA256')):
              if v.digest(root / 'signature-receipts' / filename) != signatures[field]:
                  raise ValueError('Altered verifier configuration')
          v.inventory(root / 'acquired-archives', m['packages'])
          v.inventory(root / 'signature-receipts/archives', m['packages'])
          v.write_json(root / 'metadata/machine-evidence.json', {
              'schemaVersion': 1, 'status': 'SIGNATURES_VERIFIED_PENDING_PLATFORM_REVIEW',
              'manifestSHA256': v.MANIFEST_SHA256, 'packages': 37,
              'sourceSHA': provenance['sourceSHA'],
              'remaining': 'Actual Setup job version and normal selected trust-chain review; repository artifact retention remains unobserved here.',
          })
          PY
      - name: Preserve only diagnostic evidence, including failures
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0; Node24, runner >=2.327.1
        with:
          name: https-key-provider-signatures-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          include-hidden-files: false
          path: |
            ${{ runner.temp }}/https-key-provider-proof/metadata/provenance.json
            ${{ runner.temp }}/https-key-provider-proof/metadata/machine-evidence.json
            ${{ runner.temp }}/https-key-provider-proof/metadata/global.json
            ${{ runner.temp }}/https-key-provider-proof/metadata/sdk-info.stdout.log
            ${{ runner.temp }}/https-key-provider-proof/metadata/sdk-info.stderr.log
            ${{ runner.temp }}/https-key-provider-proof/download-receipts/download-receipt.json
            ${{ runner.temp }}/https-key-provider-proof/signature-receipts/receipt.json
            ${{ runner.temp }}/https-key-provider-proof/signature-receipts/global.json
            ${{ runner.temp }}/https-key-provider-proof/signature-receipts/nuget-verification.config
            ${{ runner.temp }}/https-key-provider-proof/signature-receipts/*.stdout.log
            ${{ runner.temp }}/https-key-provider-proof/signature-receipts/*.stderr.log
