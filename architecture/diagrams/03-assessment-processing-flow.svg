<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="980" viewBox="0 0 1700 980" role="img" aria-labelledby="title desc">
  <title id="title">IGA health-assessment pilot processing flow</title>
  <desc id="desc">An authorized consultant selects an immutable evidence baseline. The platform locks versions, creates coverage and durable work, processes deterministic and constrained AI analysis, correlates and scores results, governs human review, then publishes immutable dashboard, PDF, Markdown, share-link, and read-only MCP representations.</desc>
  <defs>
    <style>
      .title{font:600 30px 'Segoe UI',Arial,sans-serif;fill:#172033}.subtitle{font:400 16px 'Segoe UI',Arial,sans-serif;fill:#526174}.lane-title{font:600 18px 'Segoe UI',Arial,sans-serif;fill:#172033}.label{font:600 15px 'Segoe UI',Arial,sans-serif;fill:#172033}.small{font:400 13px 'Segoe UI',Arial,sans-serif;fill:#526174}.tiny{font:400 12px 'Segoe UI',Arial,sans-serif;fill:#526174}.number{font:600 15px 'Segoe UI',Arial,sans-serif;fill:#fff}.box{fill:#fff;stroke:#9aacbd;stroke-width:1.4}.azure{fill:#f3f8fd;stroke:#0078d4;stroke-width:1.7}.human{fill:#f7f4fb;stroke:#7451a6;stroke-width:1.5}.ai{fill:#fff8f5;stroke:#b3544b;stroke-width:1.5}.store{fill:#f2faf6;stroke:#29845d;stroke-width:1.5}.lane{fill:#fbfdff;stroke:#d5e0e9;stroke-width:1.3}.flow{fill:none;stroke:#2476b8;stroke-width:2.5;marker-end:url(#arrow)}.event{fill:none;stroke:#7451a6;stroke-width:2.3;stroke-dasharray:7 5;marker-end:url(#arrow-purple)}.external{fill:none;stroke:#b3544b;stroke-width:2.3;stroke-dasharray:8 5;marker-end:url(#arrow-red)}.checkpoint{fill:none;stroke:#29845d;stroke-width:2;stroke-dasharray:3 5;marker-end:url(#arrow-green)}.note{fill:#eef6fc;stroke:#8abce1;stroke-width:1.2}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2476b8"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7451a6"/></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b3544b"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#29845d"/></marker>
  </defs>

  <rect width="1700" height="980" fill="#ffffff"/>
  <text class="title" x="48" y="55">IGA health-assessment pilot — assessment processing flow</text>
  <text class="subtitle" x="48" y="84">How immutable evidence becomes traceable, reviewed and consistently published results</text>

  <rect class="lane" x="42" y="120" width="1615" height="300" rx="16"/>
  <text class="lane-title" x="70" y="154">A. Initiate, lock and schedule</text>

  <rect class="human" x="78" y="190" width="265" height="145" rx="12"/>
  <circle cx="106" cy="214" r="16" fill="#7451a6"/><text class="number" x="101" y="220">1</text>
  <text class="label" x="135" y="218">Select immutable baseline</text>
  <text class="small" x="102" y="250">Authorized consultant selects:</text>
  <text class="small" x="102" y="274">• customer / project / environment</text>
  <text class="small" x="102" y="296">• baseline + assessment profile</text>
  <text class="tiny" x="102" y="319">Eligibility must be pilot-validated</text>

  <rect class="store" x="397" y="190" width="280" height="145" rx="12"/>
  <circle cx="425" cy="214" r="16" fill="#29845d"/><text class="number" x="420" y="220">2</text>
  <image href="icons/azure-postgresql.svg" x="613" y="206" width="42" height="42" preserveAspectRatio="xMidYMid meet"/>
  <text class="label" x="454" y="218">Lock every input version</text>
  <text class="small" x="421" y="250">Baseline, capability, rule catalog,</text>
  <text class="small" x="421" y="274">profile, outcomes, AI policy, prompt,</text>
  <text class="small" x="421" y="298">model and application version</text>
  <text class="tiny" x="421" y="319">Idempotency key prevents duplicate runs</text>

  <rect class="box" x="731" y="190" width="280" height="145" rx="12"/>
  <circle cx="759" cy="214" r="16" fill="#2476b8"/><text class="number" x="754" y="220">3</text>
  <text class="label" x="788" y="218">Create coverage and work</text>
  <text class="small" x="755" y="250">Inventory every supported object and</text>
  <text class="small" x="755" y="274">required evidence category; record gap</text>
  <text class="small" x="755" y="298">states rather than silently omitting them</text>
  <text class="tiny" x="755" y="319">Planner creates versioned work units</text>

  <rect class="azure" x="1065" y="190" width="260" height="145" rx="12"/>
  <circle cx="1093" cy="214" r="16" fill="#0078d4"/><text class="number" x="1088" y="220">4</text>
  <image href="icons/azure-service-bus.svg" x="1259" y="206" width="44" height="44" preserveAspectRatio="xMidYMid meet"/>
  <text class="label" x="1122" y="218">Commit outbox; dispatch</text>
  <text class="small" x="1089" y="250">PostgreSQL transaction commits work</text>
  <text class="small" x="1089" y="274">before Service Bus delivery signal</text>
  <text class="small" x="1089" y="298">Opaque IDs only; no evidence payload</text>
  <text class="tiny" x="1089" y="319">Reconcile publish failure; duplicate-safe</text>

  <rect class="store" x="1380" y="190" width="235" height="145" rx="12"/>
  <image href="icons/azure-storage.svg" x="1399" y="212" width="45" height="45" preserveAspectRatio="xMidYMid meet"/>
  <text class="label" x="1460" y="218">Evidence baseline</text>
  <text class="small" x="1404" y="252">Normalized • redacted</text>
  <text class="small" x="1404" y="276">content-addressed • immutable</text>
  <text class="tiny" x="1404" y="305">Workers resolve authorized references</text>

  <path class="flow" d="M343 262 H397"/>
  <path class="flow" d="M677 262 H731"/>
  <path class="flow" d="M1011 262 H1065"/>
  <path class="checkpoint" d="M1380 305 H1346 V345 H872 V335"/>
  <text class="tiny" x="1152" y="365">authorized evidence references</text>

  <rect class="lane" x="42" y="450" width="1615" height="340" rx="16"/>
  <text class="lane-title" x="70" y="484">B. Analyze, govern and publish</text>

  <rect class="azure" x="78" y="525" width="270" height="180" rx="12"/>
  <circle cx="106" cy="549" r="16" fill="#0078d4"/><text class="number" x="101" y="555">5</text>
  <image href="icons/azure-container-apps.svg" x="282" y="542" width="44" height="44" preserveAspectRatio="xMidYMid meet"/>
  <text class="label" x="135" y="553">Deterministic workers</text>
  <text class="small" x="102" y="585">Apply approved versioned rules</text>
  <text class="small" x="102" y="609">Emit typed results and citations</text>
  <text class="small" x="102" y="633">Checkpoint progress and retry safely</text>
  <text class="tiny" x="102" y="660">No customer-system mutation capability</text>
  <text class="tiny" x="102" y="682">Gaps remain explicit assessment results</text>

  <rect class="ai" x="395" y="525" width="270" height="180" rx="12"/>
  <circle cx="423" cy="549" r="16" fill="#b3544b"/><text class="number" x="418" y="555">6</text>
  <text class="label" x="452" y="553">Constrained AI analysis</text>
  <text class="small" x="419" y="585">Bounded normalized/redacted packet</text>
  <text class="small" x="419" y="609">OpenAI GPT-6 Sol • ZDR required</text>
  <text class="small" x="419" y="633">Closed schema + citation validation</text>
  <text class="tiny" x="419" y="660">No tools, raw retrieval or policy changes</text>
  <text class="tiny" x="419" y="682">Every output starts as proposed/untrusted</text>

  <rect class="box" x="712" y="525" width="270" height="180" rx="12"/>
  <circle cx="740" cy="549" r="16" fill="#2476b8"/><text class="number" x="735" y="555">7</text>
  <text class="label" x="769" y="553">Correlate and score</text>
  <text class="small" x="736" y="585">Group root causes while preserving</text>
  <text class="small" x="736" y="609">per-object occurrences and provenance</text>
  <text class="small" x="736" y="633">Compute provisional + publishable views</text>
  <text class="tiny" x="736" y="660">Maturity remains separate from health</text>
  <text class="tiny" x="736" y="682">Unreviewed AI cannot alter published score</text>

  <rect class="human" x="1029" y="525" width="270" height="180" rx="12"/>
  <circle cx="1057" cy="549" r="16" fill="#7451a6"/><text class="number" x="1052" y="555">8</text>
  <text class="label" x="1086" y="553">Human governance</text>
  <text class="small" x="1053" y="585">Consultant/customer review and edits</text>
  <text class="small" x="1053" y="609">Critical/High AI review requirement</text>
  <text class="small" x="1053" y="633">Customer-only residual-risk acceptance</text>
  <text class="tiny" x="1053" y="660">Append-only dispositions and audit</text>
  <text class="tiny" x="1053" y="682">Warned publication remains attributable</text>

  <rect class="store" x="1346" y="525" width="269" height="180" rx="12"/>
  <circle cx="1374" cy="549" r="16" fill="#29845d"/><text class="number" x="1369" y="555">9</text>
  <image href="icons/azure-storage.svg" x="1549" y="542" width="44" height="44" preserveAspectRatio="xMidYMid meet"/>
  <text class="label" x="1403" y="553">Freeze and publish</text>
  <text class="small" x="1370" y="585">Atomic immutable report manifest</text>
  <text class="small" x="1370" y="609">Dashboard • PDF • Markdown</text>
  <text class="small" x="1370" y="633">≤24h link • Phase 1D read-only MCP</text>
  <text class="tiny" x="1370" y="660">All surfaces share versions + digest</text>
  <text class="tiny" x="1370" y="682">Publication never rewrites the run</text>

  <path class="flow" d="M348 615 H395"/>
  <path class="flow" d="M665 615 H712"/>
  <path class="flow" d="M982 615 H1029"/>
  <path class="flow" d="M1299 615 H1346"/>
  <path class="event" d="M1195 525 V494 H215 V525"/>
  <text class="tiny" x="630" y="487">review changes recalculate current snapshots without changing locked inputs</text>

  <rect class="note" x="80" y="835" width="1535" height="85" rx="12"/>
  <text class="label" x="106" y="865">10. Reassessment is a new immutable run</text>
  <text class="small" x="106" y="890">A new baseline repeats the same process, correlates occurrences as new / resolved / persistent / reopened, and explains whether changes came from evidence, rules, profiles, outcomes or dispositions.</text>

  <path class="event" d="M1480 705 V812 H218 V835"/>

  <g transform="translate(48 950)">
    <line x1="0" y1="0" x2="48" y2="0" class="flow"/><text class="tiny" x="62" y="5">primary flow</text>
    <line x1="185" y1="0" x2="233" y2="0" class="event"/><text class="tiny" x="247" y="5">governance / recurrence</text>
    <line x1="460" y1="0" x2="508" y2="0" class="checkpoint"/><text class="tiny" x="522" y="5">authorized reference / checkpoint</text>
  </g>
</svg>
